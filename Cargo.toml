[package]
name = "htop-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.99.1"
authors = ["Trung Lê"]
description = "A Rust port of htop - an interactive process viewer"
license = "GPL-2.0-or-later"
repository = "https://github.com/runlevel5/htop-rs"
keywords = ["htop", "process", "monitor", "terminal", "ncurses"]
categories = ["command-line-utilities", "os"]
default-run = "htop-rs"

[dependencies]
# Pure Rust ncurses implementation - no C dependencies
ncurses = { git = "https://github.com/runlevel5/ncurses-pure-rs", package = "ncurses-pure", features = ["wide", "mouse"] }

# Command line argument parsing
clap = { version = "4.6", features = ["derive"] }

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Time handling
chrono = "0.4.45"

# User/group information
uzers = "0.12.2"

# Bitflags for scan flags
bitflags = "2.13"
os_info = "3.15"

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"
rayon = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
mach2 = "0.7"
libc = "1.0.0-alpha.5"
rayon = "1.12"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "user", "process", "resource"] }
libc = "1.0.0-alpha.5"

[features]
default = []
hwloc = []  # Optional hardware locality support

[[bin]]
name = "htop-rs"
path = "src/main.rs"

[[bin]]
name = "list_kernel_threads"
path = "tools/list_kernel_threads.rs"

[[bin]]
name = "debug_kernel_threads"
path = "tools/debug_kernel_threads.rs"

[package.metadata.deb]
name = "htop-rs"
section = "utils"
priority = "optional"
extended-description = """\
htop-rs is a Rust port of htop, the interactive process viewer. \
It aims to be a faithful recreation of htop's user interface and \
functionality, implemented entirely in Rust with no external libraries."""
assets = [
    ["target/release/htop-rs", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/htop-rs/README.md", "644"],
    ["packaging/deb/htop-rs.desktop", "usr/share/applications/", "644"],
    ["logo-small.png", "usr/share/pixmaps/htop-rs.png", "644"],
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Profiling: optimized but with debug symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Optimize dependencies even in debug builds for better dev experience
[profile.dev.package."*"]
opt-level = 2

# Slightly optimize debug builds for better performance during development
[profile.dev]
opt-level = 1
